<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cyberpunk Weather App</title>
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=VT323&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="weather-app">
            <div class="app-header">
                <div class="header-left">
                    <div class="app-title">CYBER<span class="text-accent">WEATHER</span></div>
                    <div class="app-subtitle">v2.0.7</div>
                </div>
                <div class="header-right">
                    <div class="time-display" id="currentTime">00:00:00</div>
                    <div class="date-display" id="currentDate">--/--/----</div>
                </div>
            </div>
            
            <div class="search-container">
                <form id="searchForm">
                    <div class="search-bar">
                        <input type="text" id="searchInput" placeholder="Enter city name..." autocomplete="off">
                        <button type="submit" id="searchButton">SCAN</button>
                    </div>
                </form>
            </div>
            
            <div class="loading-container" id="loadingContainer">
                <div class="loading-icon"></div>
                <div class="loading-text">Scanning atmospheric data...</div>
            </div>
            
            <div class="error-container hidden" id="errorContainer">
                <div class="error-icon">!</div>
                <div class="error-message" id="errorMessage">Location not found. Try different coordinates.</div>
            </div>
            
            <div class="weather-container hidden" id="weatherContainer">
                <div class="weather-primary">
                    <div class="location-info">
                        <div class="city-name" id="cityName">City Name</div>
                        <div class="country-name" id="countryName">Country</div>
                    </div>
                    
                    <div class="weather-display">
                        <div class="temperature-container">
                            <div class="temperature" id="temperature">--°C</div>
                            <div class="feels-like">FEELS LIKE: <span id="feelsLike">--°C</span></div>
                        </div>
                        <div class="weather-icon-container">
                            <div class="weather-icon" id="weatherIcon"></div>
                            <div class="weather-description" id="weatherDescription">--</div>
                        </div>
                    </div>
                </div>
                
                <div class="weather-details">
                    <div class="detail-item">
                        <div class="detail-label">HUMIDITY</div>
                        <div class="detail-value" id="humidity">--%</div>
                        <div class="detail-progress">
                            <div class="progress-bar" id="humidityBar"></div>
                        </div>
                    </div>
                    
                    <div class="detail-item">
                        <div class="detail-label">WIND</div>
                        <div class="detail-value" id="windSpeed">-- m/s</div>
                        <div class="wind-direction" id="windDirection"></div>
                    </div>
                    
                    <div class="detail-item">
                        <div class="detail-label">PRESSURE</div>
                        <div class="detail-value" id="pressure">-- hPa</div>
                        <div class="detail-status" id="pressureStatus">NORMAL</div>
                    </div>
                    
                    <div class="detail-item">
                        <div class="detail-label">VISIBILITY</div>
                        <div class="detail-value" id="visibility">-- km</div>
                        <div class="detail-progress">
                            <div class="progress-bar" id="visibilityBar"></div>
                        </div>
                    </div>
                </div>
                
                <div class="forecast-container">
                    <div class="forecast-title">24-HOUR FORECAST</div>
                    <div class="forecast-grid" id="forecastGrid">
                        <!-- Forecast items will be inserted here by JavaScript -->
                    </div>
                </div>
            </div>
            
            <div class="app-footer">
                <a href="../../index.html?skipIntro=true#projects" class="back-link">← Back to My Work</a>
                <div class="data-source">Data: OpenWeather API</div>
            </div>
        </div>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
