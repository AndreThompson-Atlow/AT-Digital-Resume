<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CyberCalc</title>
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=VT323&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="calculator">
            <div class="calculator-header">
                <div class="calculator-brand">CYBER<span class="text-accent">CALC</span></div>
                <div class="calculator-model">CX-3000</div>
            </div>
            <div class="calculator-screen">
                <div class="calculation-history" id="history"></div>
                <div class="current-calculation" id="display">0</div>
            </div>
            <div class="calculator-buttons">
                <button class="button function-btn" data-action="clear">AC</button>
                <button class="button function-btn" data-action="delete">DEL</button>
                <button class="button function-btn" data-action="percent">%</button>
                <button class="button operator-btn" data-action="divide">÷</button>
                
                <button class="button number-btn" data-action="number">7</button>
                <button class="button number-btn" data-action="number">8</button>
                <button class="button number-btn" data-action="number">9</button>
                <button class="button operator-btn" data-action="multiply">×</button>
                
                <button class="button number-btn" data-action="number">4</button>
                <button class="button number-btn" data-action="number">5</button>
                <button class="button number-btn" data-action="number">6</button>
                <button class="button operator-btn" data-action="subtract">-</button>
                
                <button class="button number-btn" data-action="number">1</button>
                <button class="button number-btn" data-action="number">2</button>
                <button class="button number-btn" data-action="number">3</button>
                <button class="button operator-btn" data-action="add">+</button>
                
                <button class="button number-btn zero-btn" data-action="number">0</button>
                <button class="button number-btn" data-action="decimal">.</button>
                <button class="button equals-btn" data-action="calculate">=</button>
            </div>
            <div class="calculator-footer">
                <a href="../../index.html?skipIntro=true#projects" class="back-link">← Back to My Work</a>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
