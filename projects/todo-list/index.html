<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cyberpunk Todo List</title>
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=VT323&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="todo-app">
            <div class="app-header">
                <div class="app-title">CYBER<span class="text-accent">TASKS</span></div>
                <div class="app-subtitle">v3.1.7</div>
            </div>
            
            <form id="todo-form" class="todo-form">
                <div class="input-group">
                    <input type="text" id="todo-input" placeholder="Enter task description..." autocomplete="off">
                    <button type="submit" id="add-button">ADD</button>
                </div>
                <div class="priority-selector">
                    <span class="priority-label">PRIORITY:</span>
                    <div class="priority-options">
                        <label class="priority-option">
                            <input type="radio" name="priority" value="low" checked>
                            <span class="priority-text low">LOW</span>
                        </label>
                        <label class="priority-option">
                            <input type="radio" name="priority" value="medium">
                            <span class="priority-text medium">MEDIUM</span>
                        </label>
                        <label class="priority-option">
                            <input type="radio" name="priority" value="high">
                            <span class="priority-text high">HIGH</span>
                        </label>
                        <label class="priority-option">
                            <input type="radio" name="priority" value="critical">
                            <span class="priority-text critical">CRITICAL</span>
                        </label>
                    </div>
                </div>
            </form>
            
            <div class="list-controls">
                <div class="filter-container">
                    <label for="filter-select">FILTER:</label>
                    <select id="filter-select">
                        <option value="all">ALL TASKS</option>
                        <option value="active">ACTIVE</option>
                        <option value="completed">COMPLETED</option>
                    </select>
                </div>
                <button id="clear-completed" class="clear-button">CLEAR COMPLETED</button>
            </div>
            
            <div class="task-stats">
                <div class="stat-item">
                    <span class="stat-label">TOTAL:</span>
                    <span class="stat-value" id="total-tasks">0</span>
                </div>
                <div class="stat-item">
                    <span class="stat-label">ACTIVE:</span>
                    <span class="stat-value" id="active-tasks">0</span>
                </div>
                <div class="stat-item">
                    <span class="stat-label">COMPLETED:</span>
                    <span class="stat-value" id="completed-tasks">0</span>
                </div>
            </div>
            
            <div class="todo-list-container">
                <div class="list-header">
                    <div class="header-status">STATUS</div>
                    <div class="header-task">TASK</div>
                    <div class="header-priority">PRIORITY</div>
                    <div class="header-actions">ACTIONS</div>
                </div>
                
                <div id="todo-list" class="todo-list">
                    <!-- Tasks will be added here by JavaScript -->
                </div>
                
                <div class="empty-state hidden" id="empty-state">
                    <div class="empty-icon">📝</div>
                    <div class="empty-text">NO TASKS FOUND</div>
                    <div class="empty-subtext">Add a new task to get started</div>
                </div>
            </div>
            
            <div class="app-footer">
                <a href="../../index.html?skipIntro=true#projects" class="back-link">← Back to My Work</a>
                <div class="time-info" id="current-time">--:--:--</div>
            </div>
        </div>
    </div>
    
    <!-- Task Item Template -->
    <template id="task-template">
        <div class="task-item">
            <div class="task-status">
                <label class="checkbox-container">
                    <input type="checkbox" class="task-checkbox">
                    <span class="checkmark"></span>
                </label>
            </div>
            <div class="task-content">
                <span class="task-text"></span>
                <span class="task-date"></span>
            </div>
            <div class="task-priority">
                <span class="priority-badge"></span>
            </div>
            <div class="task-actions">
                <button class="edit-btn">EDIT</button>
                <button class="delete-btn">DELETE</button>
            </div>
        </div>
    </template>
    
    <!-- Edit Task Modal -->
    <div class="modal" id="edit-modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>EDIT TASK</h2>
                <button class="close-modal">&times;</button>
            </div>
            <form id="edit-form">
                <div class="form-group">
                    <label for="edit-input">TASK:</label>
                    <input type="text" id="edit-input" required>
                </div>
                <div class="form-group">
                    <label>PRIORITY:</label>
                    <div class="priority-options">
                        <label class="priority-option">
                            <input type="radio" name="edit-priority" value="low">
                            <span class="priority-text low">LOW</span>
                        </label>
                        <label class="priority-option">
                            <input type="radio" name="edit-priority" value="medium">
                            <span class="priority-text medium">MEDIUM</span>
                        </label>
                        <label class="priority-option">
                            <input type="radio" name="edit-priority" value="high">
                            <span class="priority-text high">HIGH</span>
                        </label>
                        <label class="priority-option">
                            <input type="radio" name="edit-priority" value="critical">
                            <span class="priority-text critical">CRITICAL</span>
                        </label>
                    </div>
                </div>
                <div class="form-actions">
                    <button type="submit" class="save-btn">SAVE</button>
                    <button type="button" class="cancel-btn">CANCEL</button>
                </div>
            </form>
        </div>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
